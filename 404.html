<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0F0A1A;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #9A94B0;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(108, 60, 225, 0.1);
            border-top-color: #6C3CE1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            color: #FFFFFF;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        p {
            color: #6B6480;
        }
        .url {
            color: #8B6EF0;
            font-weight: 500;
            margin-top: 12px;
            word-break: break-all;
        }
        .error {
            color: #ef4444;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Redirecionando...</h1>
        <p>Você será redirecionado em instantes</p>
        <div class="url" id="urlDisplay"></div>
        <div class="error" id="errorMsg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore,
            collection,
            query,
            where,
            getDocs,
            updateDoc,
            doc,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        // COLE SUA CONFIGURAÇÃO AQUI
        const firebaseConfig = {
            apiKey: "AIzaSyCWlMxdEEJ3ghJmczYGI0B0OK0Kaku1QtE",
            authDomain: "balcao-a3363.firebaseapp.com",
            projectId: "balcao-a3363",
            storageBucket: "balcao-a3363.firebasestorage.app",
            messagingSenderId: "696763021614",
            appId: "1:696763021614:web:f568acd4c637a79027a2bf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlDisplay = document.getElementById('urlDisplay');
        const errorMsg = document.getElementById('errorMsg');

        async function redirect() {
            // Pega o código da URL
            const path = window.location.pathname;
            const codigo = path.replace('/', '').trim();
            
            if (!codigo) {
                errorMsg.textContent = 'Link inválido';
                return;
            }

            try {
                // Buscar link no Firebase
                const q = query(
                    collection(db, 'links'),
                    where('codigo', '==', codigo)
                );
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    errorMsg.textContent = 'Link não encontrado ou expirado';
                    return;
                }

                const linkDoc = snapshot.docs[0];
                const linkData = linkDoc.data();

                if (!linkData.ativo) {
                    errorMsg.textContent = 'Este link foi desativado';
                    return;
                }

                // Registrar clique
                await updateDoc(linkDoc.ref, {
                    cliques: (linkData.cliques || 0) + 1,
                    ultimoClique: serverTimestamp()
                });

                // Mostrar URL e redirecionar
                urlDisplay.textContent = '🔗 ' + linkData.urlOriginal;
                
                setTimeout(() => {
                    window.location.href = linkData.urlOriginal;
                }, 1500);

            } catch (error) {
                console.error('Erro:', error);
                errorMsg.textContent = 'Erro ao processar redirecionamento';
            }
        }

        // Executar
        redirect();
    </script>
</body>
</html>
