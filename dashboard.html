<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - EncurtaLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .dashboard {
            padding: 120px 0 60px;
            min-height: 100vh;
            background: var(--dark);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
            padding: 24px;
            background: var(--gray-900);
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
        }

        .user-email {
            color: var(--gray-400);
            font-size: 0.9rem;
        }

        .user-name {
            color: var(--white);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--gray-900);
            padding: 24px;
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-card .number {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--white);
        }

        .stat-card .label {
            color: var(--gray-400);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .stat-card .icon {
            float: right;
            font-size: 1.8rem;
            color: var(--primary-light);
            opacity: 0.5;
        }

        .link-form {
            background: var(--gray-900);
            padding: 32px;
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 40px;
        }

        .link-form .form-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .link-form input {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid var(--gray-800);
            border-radius: 12px;
            background: var(--dark);
            color: var(--white);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            min-width: 200px;
        }

        .link-form input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.1);
        }

        .link-form input::placeholder {
            color: var(--gray-600);
        }

        .links-list {
            background: var(--gray-900);
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .links-list-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .links-list-header h3 {
            color: var(--white);
            font-weight: 600;
        }

        .links-list-header .total {
            color: var(--gray-400);
            font-size: 0.9rem;
        }

        .link-item {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transition: var(--transition);
        }

        .link-item:hover {
            background: rgba(255,255,255,0.02);
        }

        .link-item:last-child {
            border-bottom: none;
        }

        .link-info {
            flex: 1;
            min-width: 200px;
        }

        .link-info .url-short {
            color: var(--primary-light);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .link-info .url-short:hover {
            color: var(--white);
        }

        .link-info .url-original {
            color: var(--gray-600);
            font-size: 0.85rem;
            display: block;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 400px;
        }

        .link-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--gray-400);
            font-size: 0.85rem;
        }

        .link-meta .cliques {
            background: rgba(108, 60, 225, 0.12);
            padding: 4px 12px;
            border-radius: 100px;
            color: var(--primary-light);
        }

        .link-actions {
            display: flex;
            gap: 8px;
        }

        .link-actions button {
            background: transparent;
            border: none;
            color: var(--gray-600);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .link-actions button:hover {
            background: rgba(255,255,255,0.05);
            color: var(--white);
        }

        .link-actions .btn-copy:hover {
            color: #10b981;
        }

        .link-actions .btn-delete:hover {
            color: #ef4444;
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--gray-600);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .loading-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--gray-600);
        }

        .loading-state i {
            font-size: 2rem;
            margin-bottom: 12px;
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .user-info {
                justify-content: center;
            }

            .link-item {
                flex-direction: column;
                align-items: stretch;
            }

            .link-info .url-original {
                max-width: 100%;
            }

            .link-meta {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <i class="fas fa-link"></i>
                    <span>Encurta<span>Link</span></span>
                </div>
                <div class="nav-actions">
                    <button id="btnSair" class="btn btn-outline">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <section class="dashboard">
        <div class="container">
            <div class="dashboard-header">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div>
                        <div class="user-name" id="userName">Usuário</div>
                        <div class="user-email" id="userEmail">email@exemplo.com</div>
                    </div>
                </div>
                <div>
                    <span style="color: var(--gray-400);">
                        <i class="fas fa-calendar-alt"></i> 
                        Plano: <strong style="color: var(--white);">Gratuito</strong>
                    </span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-link icon"></i>
                    <div class="number" id="totalLinks">0</div>
                    <div class="label">Total de Links</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-mouse-pointer icon"></i>
                    <div class="number" id="totalCliques">0</div>
                    <div class="label">Cliques Totais</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-arrow-right icon"></i>
                    <div class="number" id="mediaCliques">0</div>
                    <div class="label">Média por Link</div>
                </div>
            </div>

            <div class="link-form">
                <h3 style="color: var(--white); margin-bottom: 16px;">
                    <i class="fas fa-plus-circle" style="color: var(--primary);"></i> 
                    Novo Link
                </h3>
                <div class="form-group">
                    <input 
                        type="url" 
                        id="inputUrl" 
                        placeholder="Cole sua URL aqui (ex: https://meusite.com/promo)" 
                        required
                    />
                    <button id="btnEncurtar" class="btn btn-primary">
                        <i class="fas fa-scissors"></i> Encurtar
                    </button>
                </div>
            </div>

            <div class="links-list">
                <div class="links-list-header">
                    <h3>Meus Links</h3>
                    <span class="total" id="totalLinksLabel">0 links</span>
                </div>
                <div id="linksContainer">
                    <div class="loading-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Carregando seus links...</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getFirestore,
            collection,
            query,
            where,
            getDocs,
            onSnapshot,
            addDoc,
            deleteDoc,
            doc,
            updateDoc,
            serverTimestamp,
            orderBy
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        import { firebaseConfig } from './config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const inputUrl = document.getElementById('inputUrl');
        const btnEncurtar = document.getElementById('btnEncurtar');
        const linksContainer = document.getElementById('linksContainer');
        const totalLinksEl = document.getElementById('totalLinks');
        const totalCliquesEl = document.getElementById('totalCliques');
        const mediaCliquesEl = document.getElementById('mediaCliques');
        const totalLinksLabel = document.getElementById('totalLinksLabel');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');
        const btnSair = document.getElementById('btnSair');
        const toast = document.getElementById('toast');

        let usuarioAtual = null;
        let links = [];
        let unsubscribeLinks = null;

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.style.display = 'block';
            clearTimeout(toast.timeout);
            toast.timeout = setTimeout(() => {
                toast.style.display = 'none';
            }, 4000);
        }

        function generateShortCode(length = 6) {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < length; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        async function encurtarLink() {
            let url = inputUrl.value.trim();
            if (!url) {
                showToast('Por favor, cole uma URL válida', 'error');
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            try {
                btnEncurtar.disabled = true;
                btnEncurtar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Encurtando...';

                let codigo = generateShortCode(6);
                let existe = true;
                let tentativas = 0;

                while (existe && tentativas < 5) {
                    const q = query(
                        collection(db, 'links'),
                        where('codigo', '==', codigo)
                    );
                    const snapshot = await getDocs(q);
                    if (snapshot.empty) {
                        existe = false;
                    } else {
                        codigo = generateShortCode(7);
                        tentativas++;
                    }
                }

                const urlEncurtada = `${window.location.origin}${window.location.pathname.replace('dashboard.html', '')}redirect.html?c=${codigo}`;
                
                await addDoc(collection(db, 'links'), {
                    codigo: codigo,
                    urlOriginal: url,
                    urlEncurtada: urlEncurtada,
                    usuarioId: usuarioAtual.uid,
                    criadoEm: serverTimestamp(),
                    cliques: 0,
                    ativo: true,
                    titulo: url.replace(/^https?:\/\//, '').substring(0, 50)
                });

                inputUrl.value = '';
                showToast('✅ Link encurtado com sucesso!');
                
                navigator.clipboard.writeText(urlEncurtada).then(() => {
                    showToast('📋 Link copiado para a área de transferência!');
                }).catch(() => {});

            } catch (error) {
                console.error('Erro:', error);
                showToast('❌ Erro ao encurtar: ' + error.message, 'error');
            } finally {
                btnEncurtar.disabled = false;
                btnEncurtar.innerHTML = '<i class="fas fa-scissors"></i> Encurtar';
            }
        }

        function carregarLinks() {
            if (unsubscribeLinks) {
                unsubscribeLinks();
            }

            const q = query(
                collection(db, 'links'),
                where('usuarioId', '==', usuarioAtual.uid),
                orderBy('criadoEm', 'desc')
            );

            unsubscribeLinks = onSnapshot(q, (snapshot) => {
                links = [];
                let totalCliques = 0;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    links.push({
                        id: doc.id,
                        ...data,
                        cliques: data.cliques || 0
                    });
                    totalCliques += data.cliques || 0;
                });

                renderLinks();
                atualizarStats(totalCliques);
            }, (error) => {
                console.error('Erro ao carregar links:', error);
                linksContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Erro ao carregar links</p>
                        <p style="font-size: 0.9rem; color: var(--gray-600);">Tente recarregar a página</p>
                    </div>
                `;
            });
        }

        function renderLinks() {
            if (links.length === 0) {
                linksContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-link"></i>
                        <p>Nenhum link criado ainda.</p>
                        <p style="font-size: 0.9rem; color: var(--gray-600);">
                            Comece encurtando seu primeiro link acima!
                        </p>
                    </div>
                `;
                totalLinksLabel.textContent = '0 links';
                return;
            }

            let html = '';
            links.forEach((link) => {
                const data = link.criadoEm?.toDate?.() || new Date();
                const dataFormatada = data.toLocaleDateString('pt-BR');
                const horaFormatada = data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                
                html += `
                    <div class="link-item">
                        <div class="link-info">
                            <span class="url-short" onclick="copiarLink('${link.urlEncurtada}')">
                                <i class="fas fa-link"></i> ${link.codigo}
                            </span>
                            <span class="url-original" title="${link.urlOriginal}">
                                ${link.urlOriginal}
                            </span>
                        </div>
                        <div class="link-meta">
                            <span class="cliques">
                                <i class="fas fa-mouse-pointer"></i> ${link.cliques}
                            </span>
                            <span>
                                <i class="fas fa-calendar-alt"></i> ${dataFormatada} ${horaFormatada}
                            </span>
                        </div>
                        <div class="link-actions">
                            <button class="btn-copy" onclick="copiarLink('${link.urlEncurtada}')" title="Copiar">
                                <i class="fas fa-copy"></i>
                            </button>
                            <button class="btn-delete" onclick="deletarLink('${link.id}')" title="Excluir">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            linksContainer.innerHTML = html;
            totalLinksLabel.textContent = `${links.length} links`;
        }

        function atualizarStats(totalCliques) {
            totalLinksEl.textContent = links.length;
            totalCliquesEl.textContent = totalCliques;
            const media = links.length > 0 ? Math.round(totalCliques / links.length) : 0;
            mediaCliquesEl.textContent = media;
        }

        window.copiarLink = function(url) {
            navigator.clipboard.writeText(url).then(() => {
                showToast('📋 Link copiado!', 'success');
            }).catch(() => {
                // Fallback
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast('📋 Link copiado!', 'success');
            });
        };

        window.deletarLink = async function(linkId) {
            if (!confirm('Tem certeza que deseja excluir este link?')) return;
            
            try {
                await deleteDoc(doc(db, 'links', linkId));
                showToast('🗑️ Link excluído com sucesso!');
            } catch (error) {
                console.error('Erro ao excluir:', error);
                showToast('❌ Erro ao excluir link', 'error');
            }
        };

        btnEncurtar.addEventListener('click', encurtarLink);
        inputUrl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') encurtarLink();
        });

        btnSair.addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'index.html';
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioAtual = user;
                const nome = user.displayName || user.email?.split('@')[0] || 'Usuário';
                userAvatar.textContent = nome.charAt(0).toUpperCase();
                userName.textContent = nome;
                userEmail.textContent = user.email || 'email@exemplo.com';
                carregarLinks();
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
