<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0F0A1A;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #9A94B0;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(108, 60, 225, 0.1);
            border-top-color: #6C3CE1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            color: #FFFFFF;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        p {
            color: #6B6480;
        }
        .url {
            color: #8B6EF0;
            font-weight: 500;
            margin-top: 12px;
            word-break: break-all;
        }
        .error {
            color: #ef4444;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Redirecionando...</h1>
        <p>Você será redirecionado em instantes</p>
        <div class="url" id="urlDisplay"></div>
        <div class="error" id="errorMsg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore,
            collection,
            query,
            where,
            getDocs,
            updateDoc,
            doc,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCWlMxdEEJ3ghJmczYGI0B0OK0Kaku1QtE",
            authDomain: "balcao-a3363.firebaseapp.com",
            projectId: "balcao-a3363",
            storageBucket: "balcao-a3363.firebasestorage.app",
            messagingSenderId: "696763021614",
            appId: "1:696763021614:web:f568acd4c637a79027a2bf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlDisplay = document.getElementById('urlDisplay');
        const errorMsg = document.getElementById('errorMsg');

        function getDispositivo() {
            const ua = navigator.userAgent;
            if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) return 'Tablet';
            if (/Mobile|Android|iP(hone|od)|IEMobile|BlackBerry|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/.test(ua)) return 'Smartphone';
            return 'Desktop';
        }

        function getNavegador() {
            const ua = navigator.userAgent;
            if (ua.includes('Chrome')) return 'Chrome';
            if (ua.includes('Firefox')) return 'Firefox';
            if (ua.includes('Safari')) return 'Safari';
            if (ua.includes('Edge')) return 'Edge';
            if (ua.includes('Opera')) return 'Opera';
            return 'Outro';
        }

        function getSO() {
            const ua = navigator.userAgent;
            if (ua.includes('Windows')) return 'Windows';
            if (ua.includes('Mac')) return 'macOS';
            if (ua.includes('Linux')) return 'Linux';
            if (ua.includes('Android')) return 'Android';
            if (ua.includes('iOS')) return 'iOS';
            return 'Outro';
        }

        async function redirect() {
            const params = new URLSearchParams(window.location.search);
            let codigo = params.get('c');
            if (!codigo) {
                const path = window.location.pathname;
                codigo = path.replace(/^\/+|\/+$/g, '').split('/').pop();
            }

            if (!codigo || codigo === 'redirect.html' || codigo === '404.html') {
                errorMsg.textContent = 'Link inválido';
                return;
            }

            try {
                const q = query(
                    collection(db, 'links'),
                    where('codigo', '==', codigo)
                );
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    errorMsg.textContent = 'Link não encontrado ou expirado';
                    return;
                }

                const linkDoc = snapshot.docs[0];
                const linkData = linkDoc.data();

                if (!linkData.ativo) {
                    errorMsg.textContent = 'Este link foi desativado';
                    return;
                }

                let geo = { ip: 'Desconhecido', city: 'Desconhecida', region: '', country_name: 'Desconhecido' };
                try {
                    const geoRes = await fetch('https://ipapi.co/json/');
                    if (geoRes.ok) {
                        geo = await geoRes.json();
                    }
                } catch (e) {}

                await addDoc(collection(db, 'cliques'), {
                    linkId: linkDoc.id,
                    codigo: codigo,
                    usuarioId: linkData.usuarioId,
                    timestamp: serverTimestamp(),
                    ip: geo.ip || 'Desconhecido',
                    cidade: geo.city || 'Desconhecida',
                    estado: geo.region || '',
                    pais: geo.country_name || 'Desconhecido',
                    dispositivo: getDispositivo(),
                    navegador: getNavegador(),
                    sistemaOperacional: getSO()
                });

                await updateDoc(linkDoc.ref, {
                    cliques: (linkData.cliques || 0) + 1,
                    ultimoClique: serverTimestamp()
                });

                urlDisplay.textContent = '🔗 ' + linkData.urlOriginal;
                
                setTimeout(() => {
                    window.location.href = linkData.urlOriginal;
                }, 1000);

            } catch (error) {
                console.error('Erro:', error);
                errorMsg.textContent = 'Erro ao processar redirecionamento';
            }
        }

        redirect();
    </script>
</body>
</html>
